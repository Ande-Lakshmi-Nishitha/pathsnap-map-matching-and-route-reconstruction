<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PathSnap Evaluator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; color: #222; }
  #side { width: 360px; padding: 16px; overflow-y: auto; border-right: 1px solid #ddd; background: #fafafa; box-sizing: border-box; }
  #map { flex: 1; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 14px; }
  label { font-size: 13px; font-weight: 600; }
  input { width: 100%; padding: 6px; box-sizing: border-box; margin: 4px 0 8px; }
  button { padding: 7px 10px; margin: 3px; border: 1px solid #888; background: white; border-radius: 4px; cursor: pointer; }
  button.sel { background: #d62728; color: white; border-color: #d62728; }
  #trips button { width: 100px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  td { border-bottom: 1px solid #e5e5e5; padding: 4px; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #status { font-size: 13px; margin: 8px 0; min-height: 18px; }
  .legend { font-size: 12px; margin-top: 10px; }
  .sw { display: inline-block; width: 18px; height: 4px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<div id="side">
  <h1>PathSnap</h1>
  <div class="sub">Map-matching evaluator UI (Laptop 2)</div>
  <label for="api">API address (Laptop 1)</label>
  <input id="api" value="http://127.0.0.1:8000">
  <button onclick="loadTrips()">Connect &amp; load trips</button>
  <div id="status"></div>
  <div id="trips"></div>
  <table id="metrics"></table>
  <div class="legend">
    <div><span class="sw" style="background:#1f77b4"></span>Raw GPS observations</div>
    <div><span class="sw" style="background:#d62728"></span>Predicted route (classifier + HMM)</div>
  </div>
</div>
<div id="map"></div>
<script src="app.js"></script>
</body>
</html>
